# V5, QC-LVCG (plan section 4, Tier 1: frozen backbone, identity-initialised pose).
# A per-record rotation is predicted and undone before the pretrained path sees the
# trajectory. The pose head starts at the identity, so V5(t=0) = V0.

pretrained:
  checkpoint: checkpoints/m5fasts1k1/final.pt
  freeze_backbone: true

data:
  raw_root: /home/featurize/probing_raw
  splits_root: probing/data_splits
  norm_method: zscore

canonicalization:
  pose_dim: 64                 # width of the pose encoder's embedding
  pose_hidden: 32
  max_degrees: 30              # tanh bound on the correction; null leaves it unbounded
  identity_weight: 0.0         # optional penalty on the correction angle (plan: identity prior)

probe:
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 50
  patience: 5
  num_workers: 4
